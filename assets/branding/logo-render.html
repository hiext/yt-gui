<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logo Render</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
      }

      img {
        width: 1024px;
        height: 1024px;
        display: block;
      }
    </style>
  </head>
  <body>
    <img src="./hiext-yt-logo-mark.svg" alt="Hiext YT logo mark" />
  </body>
</html>
