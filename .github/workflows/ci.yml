name: Flutter CI

on:
  push:
    branches: [main, build]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run tools/fetch_embedded_tools.dart --dry-run
      - run: flutter analyze --no-fatal-infos

  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang pkg-config libgtk-3-dev libnotify-bin
      - run: flutter pub get
      - run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test-output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-output.log

  build-linux:
    name: Build (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [analyze]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            flutter-arch: x64
            deb-arch: amd64
            runner: ubuntu-24.04
            flutter-channel: stable
          - arch: arm64
            flutter-arch: arm64
            deb-arch: arm64
            runner: ubuntu-24.04-arm
            # GitHub ARM runners currently fail with flutter-action on stable.
            flutter-channel: master
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang pkg-config libgtk-3-dev dpkg-dev
      - run: flutter pub get
      - run: dart run tools/fetch_embedded_tools.dart --platform=linux
      - run: flutter build linux --release --target-platform linux-${{ matrix.flutter-arch }}
      - run: |
          set -euo pipefail
          APP_NAME="hiext-yt-gui"
          BINARY_NAME="hiext_yt_gui"
          VERSION="$(sed -n 's/^version: //p' pubspec.yaml | tr '+' '-')"
          BUNDLE_DIR="build/linux/${{ matrix.flutter-arch }}/release/bundle"
          DIST_NAME="${APP_NAME}-linux-${{ matrix.arch }}"
          mkdir -p dist
          tar -C "$BUNDLE_DIR" -czf "dist/${DIST_NAME}.tar.gz" .

          PACKAGE_ROOT="dist/deb-root"
          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT/DEBIAN" "$PACKAGE_ROOT/opt/$APP_NAME" "$PACKAGE_ROOT/usr/bin" "$PACKAGE_ROOT/usr/share/applications"
          cp -a "$BUNDLE_DIR/." "$PACKAGE_ROOT/opt/$APP_NAME/"
          ln -s "/opt/$APP_NAME/$BINARY_NAME" "$PACKAGE_ROOT/usr/bin/$APP_NAME"
          cat > "$PACKAGE_ROOT/DEBIAN/control" << EOF
          Package: $APP_NAME
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.deb-arch }}
          Depends: libgtk-3-0, libnotify4, libsqlite3-0
          Maintainer: Hiext <support@hiext.com>
          Description: yt-dlp visual desktop downloader
           Hiext YT GUI is a desktop download manager powered by yt-dlp and ffmpeg.
          EOF
          cat > "$PACKAGE_ROOT/usr/share/applications/$APP_NAME.desktop" << EOF
          [Desktop Entry]
          Name=Hiext YT GUI
          Comment=yt-dlp visual downloader
          Exec=/opt/$APP_NAME/$BINARY_NAME
          Icon=/opt/$APP_NAME/data/flutter_assets/assets/branding/hiext-yt-logo-mark.png
          Type=Application
          Categories=Utility;Video;
          EOF
          dpkg-deb --build --root-owner-group "$PACKAGE_ROOT" "dist/${DIST_NAME}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: hiext-yt-gui-linux-${{ matrix.arch }}
          path: |
            dist/hiext-yt-gui-linux-${{ matrix.arch }}.tar.gz
            dist/hiext-yt-gui-linux-${{ matrix.arch }}.deb
          if-no-files-found: error

  build-macos:
    name: Build (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [analyze]
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: apple-silicon
            runner: macos-15
          - arch: x64
            label: intel
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run tools/fetch_embedded_tools.dart --platform=macos
      - run: flutter build macos --release
      - name: Sign and notarize app
        if: startsWith(github.ref, 'refs/tags/v') && env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: tools/sign_and_notarize_macos.sh build/macos/Build/Products/Release/hiext_yt_gui.app dist/hiext-yt-gui-macos-${{ matrix.arch }}.zip
      - name: Package unsigned app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || env.MACOS_CERTIFICATE_P12_BASE64 == '' }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/hiext_yt_gui.app dist/hiext-yt-gui-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hiext-yt-gui-macos-${{ matrix.arch }}
          path: dist/hiext-yt-gui-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-windows:
    name: Build (Windows ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [analyze]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            flutter-arch: x64
            runner: windows-latest
            flutter-channel: stable
          - arch: arm64
            flutter-arch: arm64
            runner: windows-11-arm
            # GitHub ARM runners currently fail with flutter-action on stable.
            flutter-channel: master
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
      - run: flutter pub get
      - run: dart run tools/fetch_embedded_tools.dart --platform=windows
      - run: flutter build windows --release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/${{ matrix.flutter-arch }}/runner/Release/* -DestinationPath dist/hiext-yt-gui-windows-${{ matrix.arch }}.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: hiext-yt-gui-windows-${{ matrix.arch }}
          path: dist/hiext-yt-gui-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [test, build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hiext-yt-gui-*
          path: dist
          merge-multiple: true
      - run: |
          ls -lh dist
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"
      - name: Create or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_TAG" \
              --notes-file .github/RELEASE_TEMPLATE.md \
              --draft
          fi
