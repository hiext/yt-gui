name: Flutter CI

on:
  push:
    branches: [main, build]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run tools/fetch_embedded_tools.dart --dry-run
      - run: flutter analyze --no-fatal-infos

  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang pkg-config libgtk-3-dev libnotify-bin
      - run: flutter pub get
      - run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test-output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-output.log

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - run: |
          mkdir -p dist
          tar -C build/linux/x64/release -czf dist/hiext-yt-gui-linux-x64.tar.gz bundle
      - uses: actions/upload-artifact@v4
        with:
          name: hiext-yt-gui-linux-x64
          path: dist/hiext-yt-gui-linux-x64.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - run: |
          mkdir -p dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/hiext_yt_gui.app dist/hiext-yt-gui-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hiext-yt-gui-macos
          path: dist/hiext-yt-gui-macos.zip
          if-no-files-found: error

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/hiext-yt-gui-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: hiext-yt-gui-windows-x64
          path: dist/hiext-yt-gui-windows-x64.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [test, build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hiext-yt-gui-*
          path: dist
          merge-multiple: true
      - run: |
          ls -lh dist
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"
      - name: Create or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_TAG" \
              --notes-file .github/RELEASE_TEMPLATE.md \
              --draft
          fi
